<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Family Restaurant Iso</title>
    <meta name="description" content="Family Restaurant Iso の公式サイトです。">
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        color: #2f241f;
        background: #fffaf3;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        width: min(90%, 44rem);
        padding: 3rem 1.5rem;
        text-align: center;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2.2rem, 8vw, 4.5rem);
        letter-spacing: 0.04em;
      }

      p {
        margin: 0;
        font-size: 1.15rem;
        line-height: 1.8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Family Restaurant Iso</h1>
      <p>おいしい時間を、家族みんなで。</p>
    </main>
  </body>
</html>
